name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version (android/app/build.gradle.kts versionName)
        id: ver
        run: |
          v="$(bash scripts/version.sh android)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages (preinstalled Android SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android/keystore
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/keystore/edgestpan-dev.keystore
            echo "Using keystore from secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set; build-android.sh will generate a throwaway keystore. The APK will not upgrade over existing installs."
          fi
      - name: Build APK and server dex
        env:
          EDGESPAN_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'edgestpan-dev' }}
          EDGESPAN_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'edgestpan-dev' }}
          EDGESPAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'edgestpan' }}
        run: |
          chmod +x android/gradlew scripts/*.sh
          scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeSpan-Android-${{ env.VERSION }}
          path: publish/android-server/EdgeSpan-Android-${{ env.VERSION }}.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: edgestpan-server-dex-${{ env.VERSION }}
          path: publish/android-server/edgestpan-server.dex
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: android
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version (Directory.Build.props)
        id: ver
        shell: bash
        run: |
          v="$(bash scripts/version.sh windows)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: edgestpan-server-dex-${{ needs.android.outputs.version }}
          path: publish/android-server
      - name: Fetch Windows platform-tools (adb)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile "$env:RUNNER_TEMP\pt.zip"
          Expand-Archive "$env:RUNNER_TEMP\pt.zip" -DestinationPath "$env:RUNNER_TEMP\ptwin"
      - name: Fetch Virtual Display Driver (MIT, signed by upstream)
        shell: pwsh
        run: |
          # VirtualDrivers/Virtual-Display-Driver 25.7.23, x64 driver-only package (signed IddCx driver, MIT license).
          $url = "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\vdd.zip"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\vdd.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a") { throw "VDD hash mismatch $hash" }
          Expand-Archive "$env:RUNNER_TEMP\vdd.zip" -DestinationPath "$env:RUNNER_TEMP\vdd"
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Publish and build installer
        shell: bash
        run: |
          export EDGESPAN_ADB_DIR="$(cygpath -u "$RUNNER_TEMP")/ptwin/platform-tools"
          export EDGESPAN_VDD_DIR="$(cygpath -u "$RUNNER_TEMP")/vdd/VirtualDisplayDriver"
          bash scripts/publish-windows.sh
          test -f "publish/EdgeSpan-Setup-$VERSION.exe"
          ls -la publish/win-x64 "publish/EdgeSpan-Setup-$VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeSpan-Setup-${{ env.VERSION }}
          path: publish/EdgeSpan-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EdgeSpan-Android-${{ needs.android.outputs.version }}/EdgeSpan-Android-${{ needs.android.outputs.version }}.apk
            dist/EdgeSpan-Setup-${{ needs.windows.outputs.version }}/EdgeSpan-Setup-${{ needs.windows.outputs.version }}.exe
          fail_on_unmatched_files: true
